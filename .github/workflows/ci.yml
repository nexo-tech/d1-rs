name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        rust: [stable, beta]
        database: [sqlite, postgres, mysql, all]
        
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: d1rs_user
          POSTGRES_PASSWORD: d1rs_pass
          POSTGRES_DB: d1rs_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: d1rs_test
          MYSQL_USER: d1rs_user
          MYSQL_PASSWORD: d1rs_pass
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        profile: minimal
        override: true
        components: rustfmt, clippy
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev libmysqlclient-dev libsqlite3-dev
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Setup database environment
      run: |
        echo "POSTGRES_TEST_URL=postgresql://d1rs_user:d1rs_pass@localhost:5432/d1rs_test" >> $GITHUB_ENV
        echo "MYSQL_TEST_URL=mysql://d1rs_user:d1rs_pass@localhost:3306/d1rs_test" >> $GITHUB_ENV
        echo "SQLITE_TEST_URL=sqlite::memory:" >> $GITHUB_ENV
        
    - name: Wait for databases
      run: |
        # Wait for PostgreSQL
        until pg_isready -h localhost -p 5432 -U d1rs_user; do
          sleep 1
        done
        
        # Wait for MySQL
        until mysqladmin ping -h localhost -P 3306 -u d1rs_user -pd1rs_pass --silent; do
          sleep 1
        done
        
    - name: Check formatting
      run: cargo fmt -- --check
      
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      
    - name: Build
      run: |
        case ${{ matrix.database }} in
          sqlite)
            cargo build --verbose
            ;;
          postgres)
            cargo build --verbose --features postgres
            ;;  
          mysql)
            cargo build --verbose --features mysql
            ;;
          all)
            cargo build --verbose --features postgres,mysql
            ;;
        esac
        
    - name: Run tests
      run: |
        case ${{ matrix.database }} in
          sqlite)
            cargo test --verbose
            ;;
          postgres)
            cargo test --verbose --features postgres
            ;;
          mysql) 
            cargo test --verbose --features mysql
            ;;
          all)
            cargo test --verbose --features postgres,mysql
            ;;
        esac

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: d1rs_user
          POSTGRES_PASSWORD: d1rs_pass
          POSTGRES_DB: d1rs_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: d1rs_test
          MYSQL_USER: d1rs_user
          MYSQL_PASSWORD: d1rs_pass
        ports:
          - 3306:3306
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev libmysqlclient-dev libsqlite3-dev
        
    - name: Install cargo-tarpaulin
      uses: actions-rs/install@v0.1
      with:
        crate: cargo-tarpaulin
        version: latest
        
    - name: Setup database environment
      run: |
        echo "POSTGRES_TEST_URL=postgresql://d1rs_user:d1rs_pass@localhost:5432/d1rs_test" >> $GITHUB_ENV
        echo "MYSQL_TEST_URL=mysql://d1rs_user:d1rs_pass@localhost:3306/d1rs_test" >> $GITHUB_ENV
        echo "SQLITE_TEST_URL=sqlite::memory:" >> $GITHUB_ENV
        
    - name: Generate code coverage
      run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out Xml
      
    - name: Upload to codecov.io
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: false

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: d1rs_user  
          POSTGRES_PASSWORD: d1rs_pass
          POSTGRES_DB: d1rs_bench
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev libsqlite3-dev
        
    - name: Run benchmarks
      run: cargo bench --features postgres
      
    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: D1-RS Benchmark
        tool: 'cargo'
        output-file-path: target/criterion/benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true