
# macOS targets with optimized linking and framework paths
[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-Wl,-dead_strip",
  "-C", "link-arg=-Wl,-no_compact_unwind",
  "-L", "framework=/nix/store/8zhnci3ic36fqlv1vpsg01k220gn7nr0-CoreFoundation-11.0/Library/Frameworks",
  "-L", "framework=/nix/store/jr7qp85kg6iszhmdfhx9zq6lp82lfclg-Security-11.0/Library/Frameworks", 
  "-L", "framework=/nix/store/cwwl08w8h5apg7nwdy4kgl5rhq8jm1cl-SystemConfiguration-11.0/Library/Frameworks",
  "-L", "/nix/store/xpq5yfmc3hphz0l2vj25kc4abld6nnan-libiconv-109/lib",
]

[target.x86_64-apple-darwin]  
rustflags = [
  "-C", "link-arg=-Wl,-dead_strip",
  "-C", "link-arg=-Wl,-no_compact_unwind",
  "-L", "framework=/nix/store/8zhnci3ic36fqlv1vpsg01k220gn7nr0-CoreFoundation-11.0/Library/Frameworks",
  "-L", "framework=/nix/store/jr7qp85kg6iszhmdfhx9zq6lp82lfclg-Security-11.0/Library/Frameworks",
  "-L", "framework=/nix/store/cwwl08w8h5apg7nwdy4kgl5rhq8jm1cl-SystemConfiguration-11.0/Library/Frameworks",
  "-L", "/nix/store/xpq5yfmc3hphz0l2vj25kc4abld6nnan-libiconv-109/lib",
]


# Global compilation optimizations for faster builds
[build]
# jobs setting removed - cargo auto-detects available cores by default

[profile.dev]
opt-level = 1        # Slight optimization for faster debug builds
debug = 1            # Reduced debug info for faster compilation
incremental = true   # Enable incremental compilation
