[package]
name = "cloudflare-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.4", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
gluesql = { version = "0.15", default-features = false }
async-trait = "0.1"
getrandom = { version = "0.2", features = ["js"] }
futures = "0.3"

[profile.release]
lto = true