[workspace]
members = [".", "d1-rs_derive"]

[package]
name = "d1-rs"
version = "0.1.0"
edition = "2021"
description = "Database-agnostic, type-safe ORM for SQLite, PostgreSQL, and MySQL"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
d1-rs_derive = { path = "./d1-rs_derive" }
paste = "1.0"
base64 = "0.22"
regex = "1.0"
sea-query = "0.31"
sqlx = { version = "0.7", optional = true, default-features = false }
thiserror = "1.0"
rand = "0.8"

# D1/WASM dependencies (only on wasm32 targets)
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.4", features = ["d1"] }
chrono = { version = "0.4", features = ["js-sys", "clock"] }

# Native SQLite dependencies (for testing and non-wasm targets)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["chrono", "bundled"], optional = true }
tokio = { version = "1.32", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1.32", features = ["full", "test-util"] }
rusqlite = { version = "0.32", features = ["chrono", "bundled"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# Feature Matrix:
# 
# Database Backend Support:
# - sqlite: Native SQLite support via rusqlite (default for testing)
# - postgres: PostgreSQL support via sqlx (production ready)  
# - mysql: MySQL support via sqlx (enterprise compatibility)
# - d1: Cloudflare D1 support for WASM targets (WebAssembly Workers)
#
# Usage Examples:
# - Default SQLite: cargo build
# - PostgreSQL only: cargo build --no-default-features --features postgres
# - MySQL only: cargo build --no-default-features --features mysql
# - All databases: cargo build --features postgres,mysql
# - D1 + SQLite: cargo build --features d1

[features]
default = ["sqlite"]
sqlite = ["rusqlite", "tokio"]
postgres = ["sqlx", "sqlx/postgres", "sqlx/runtime-tokio-rustls", "tokio"]
mysql = ["sqlx", "sqlx/mysql", "sqlx/runtime-tokio-rustls", "tokio"] 
d1 = []

# Ensure tests run on native target by default
[package.metadata.test]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-gnu"]

# Benchmark configuration
[[bench]]
name = "query_performance"
harness = false