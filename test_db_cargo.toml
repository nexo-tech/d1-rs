[package]
name = "calendar_app_test"
version = "0.1.0"
edition = "2021"

[dependencies]
# Database - SeaORM for auto-migrations
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "1.0", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }

# Async traits
async-trait = "0.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "test_db"
path = "src/bin/test_db.rs"