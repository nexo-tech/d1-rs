name = "calendar-app"
compatibility_date = "2024-01-01"
main = "target/wasm32-unknown-unknown/release/calendar-worker.wasm"

[env.production]
name = "calendar-app"

[env.staging]
name = "calendar-app-staging"

[[d1_databases]]
binding = "DB"
database_name = "calendar-db"
database_id = "your-d1-database-id-here"

[vars]
RUST_LOG = "info"

# Environment variables (set these in Cloudflare dashboard or via wrangler secret)
# JWT_SECRET = "your-jwt-secret"
# GOOGLE_CLIENT_ID = "your-google-client-id"
# GOOGLE_CLIENT_SECRET = "your-google-client-secret"
# GOOGLE_REDIRECT_URL = "https://your-domain.workers.dev/auth/callback"