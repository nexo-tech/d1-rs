name = "cloudflare-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2023-05-18"

[build]
command = "worker-build"

# Production D1 database
[[d1_databases]]
binding = "DB"
database_name = "cloudflare-worker-db"
database_id = "YOUR_DATABASE_ID"

# Local development D1 database
[[env.dev.d1_databases]]
binding = "DB"
database_name = "cloudflare-worker-db"
preview_database_id = "local"

# Environment variables are now loaded from .dev.vars file for local development
# and should be set in Cloudflare dashboard for production
